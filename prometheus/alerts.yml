groups:
  - name: powerblockade
    rules:
      - alert: LowCacheHitRate
        expr: |
          (
            sum by (node) (powerblockade_recursor_cache_hits)
            / 
            (sum by (node) (powerblockade_recursor_cache_hits) + sum by (node) (powerblockade_recursor_cache_misses))
          ) * 100 < 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low DNS cache hit rate on {{ $labels.node }}"
          description: "Cache hit rate is {{ $value | printf \"%.1f\" }}% (threshold: 50%)"

      - alert: CriticalCacheHitRate
        expr: |
          (
            sum by (node) (powerblockade_recursor_cache_hits)
            / 
            (sum by (node) (powerblockade_recursor_cache_hits) + sum by (node) (powerblockade_recursor_cache_misses))
          ) * 100 < 20
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical DNS cache hit rate on {{ $labels.node }}"
          description: "Cache hit rate is {{ $value | printf \"%.1f\" }}% (threshold: 20%)"

      - alert: HighServfailRate
        expr: |
          (
            sum by (node) (rate(powerblockade_recursor_servfail_answers[5m]))
            / 
            sum by (node) (rate(powerblockade_recursor_questions[5m]))
          ) * 100 > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High SERVFAIL rate on {{ $labels.node }}"
          description: "SERVFAIL rate is {{ $value | printf \"%.1f\" }}% of queries"

      - alert: HighTimeoutRate
        expr: |
          (
            sum by (node) (rate(powerblockade_recursor_outgoing_timeouts[5m]))
            / 
            sum by (node) (rate(powerblockade_recursor_all_outqueries[5m]))
          ) * 100 > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High upstream timeout rate on {{ $labels.node }}"
          description: "Timeout rate is {{ $value | printf \"%.1f\" }}% of outgoing queries"

      - alert: NodeMetricsStale
        expr: |
          time() - powerblockade_recursor_last_scrape_timestamp > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Stale metrics from {{ $labels.node }}"
          description: "No metrics received from node for more than 5 minutes"

      - alert: RecursorDown
        expr: up{job="powerblockade"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PowerBlockade service down"
          description: "Cannot scrape metrics from admin-ui"

      - alert: HighQueryLatency
        expr: |
          (
            sum by (node) (powerblockade_recursor_answers_slow)
            / 
            sum by (node) (powerblockade_recursor_questions)
          ) * 100 > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High query latency on {{ $labels.node }}"
          description: "{{ $value | printf \"%.1f\" }}% of queries have latency >1s"

      - alert: HighBlockRate
        expr: |
          (
            sum by (node) (rate(powerblockade_queries_blocked_total[5m]))
            / 
            sum by (node) (rate(powerblockade_queries_total[5m]))
          ) * 100 > 50
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "High block rate on {{ $labels.node }}"
          description: "Block rate is {{ $value | printf \"%.1f\" }}% - may indicate malware or misconfiguration"

      - alert: HighNXDOMAINRate
        expr: |
          (
            sum by (node) (rate(powerblockade_recursor_nxdomain_answers[5m]))
            / 
            sum by (node) (rate(powerblockade_recursor_questions[5m]))
          ) * 100 > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High NXDOMAIN rate on {{ $labels.node }}"
          description: "NXDOMAIN rate is {{ $value | printf \"%.1f\" }}% - may indicate DGA malware"

      - alert: ConcurrentQueriesHigh
        expr: powerblockade_recursor_concurrent_queries > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High concurrent queries on {{ $labels.node }}"
          description: "{{ $value }} concurrent queries - check for DNS amplification or misconfiguration"

      - alert: NodeNotSyncing
        expr: |
          time() - powerblockade_node_last_heartbeat_timestamp > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Secondary node {{ $labels.node }} not syncing"
          description: "No heartbeat from node for more than 10 minutes"

  # --- Primary-node native scrape alerts ---------------------------------
  # Fed by the direct Prometheus scrape jobs (dnsdist, recursor, dnstap-
  # processor, and later the prober). These series only exist on the primary
  # node deployment; the powerblockade_* push-path rules above continue to
  # cover secondary nodes through admin-ui /metrics and are intentionally
  # left untouched.
  #
  # NOTE: ProberMetricsAbsent fires by design until the prober scrape job
  # (TODO(prober) in prometheus.yml) lands; expect it to be firing between
  # merge and integration.
  - name: powerblockade-primary
    rules:
      - alert: ProberMetricsAbsent
        expr: absent(powerblockade_prober_query_latency_seconds_bucket)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Prober metrics absent"
          description: "No powerblockade_prober series scraped for 10 minutes. The prober service is down, or its Prometheus scrape job has not been configured (TODO(prober) in prometheus.yml)."

      - alert: ProcessorBufferBacklog
        expr: dnstap_processor_buffer_pending > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "dnstap-processor buffer backlog"
          description: "{{ $value }} events pending in the on-disk buffer for more than 10 minutes - the primary ingest API is not keeping up or is unreachable."

      - alert: ProcessorShippingLag
        expr: |
          sum(rate(dnstap_processor_events_received_total[5m]))
          -
          sum(rate(dnstap_processor_events_shipped_total[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "dnstap-processor shipping lag"
          description: "Receiving {{ $value | printf \"%.1f\" }} more events/s than are shipped to the primary ingest API for more than 10 minutes - the pipeline cannot keep up."

      - alert: ProcessorEventsDropped
        expr: sum(rate(dnstap_processor_events_dropped_total[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "dnstap-processor dropping events"
          description: "Events are being dropped under backpressure ({{ $value | printf \"%.2f\" }}/s sustained) - DNS analytics data is being lost."
