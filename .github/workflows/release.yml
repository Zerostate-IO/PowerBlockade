name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.9.0). The version bump commit + CHANGELOG entry must already be on main.'
        required: true
        type: string
      dry_run:
        description: 'Build + gate candidate images only; no promotion, no git tag, no GitHub release.'
        required: false
        type: boolean
        default: true
      skip_docker:
        description: 'DEPRECATED. If true, nothing is built and no release can be created.'
        required: false
        type: boolean
        default: false

# Serialize dispatches per version: a second dispatch for the same version
# waits for the first, so candidates and the eventual promotion cannot race.
concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zerostate-io/powerblockade
  # Immutable candidate tag: never reused, never published as version/latest.
  CANDIDATE_TAG: candidate-${{ github.sha }}-${{ github.run_id }}

jobs:
  # ---------------------------------------------------------------------------
  # Phase 0: Validate. The version bump + CHANGELOG entry are done on main
  # BEFORE dispatch (this workflow no longer mutates the repo or pushes tags
  # early). Asserts the version surfaces agree and no competing tag exists.
  # ---------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      version_plain: ${{ steps.validate.outputs.version_plain }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version format
        id: validate
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $VERSION (expected vX.Y.Z)"
            exit 1
          fi
          VERSION_PLAIN="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_plain=$VERSION_PLAIN" >> "$GITHUB_OUTPUT"
          echo "✅ Version format valid: $VERSION"

      - name: Assert version surfaces are consistent
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION_PLAIN="${VERSION#v}"
          set -e
          # CHANGELOG must have the release heading
          grep -q "^## \[$VERSION_PLAIN\]" CHANGELOG.md || { echo "❌ CHANGELOG.md missing '## [$VERSION_PLAIN]'"; exit 1; }
          # Version surfaces must all match
          grep -q "^version = \"$VERSION_PLAIN\"$" admin-ui/pyproject.toml || { echo "❌ admin-ui/pyproject.toml not at $VERSION_PLAIN"; exit 1; }
          grep -q "^    pb_version: str = \"$VERSION\"$" admin-ui/app/settings.py || { echo "❌ settings.py pb_version not at $VERSION"; exit 1; }
          for f in admin-ui/Dockerfile dnstap-processor/Dockerfile sync-agent/Dockerfile; do
            grep -q "^ARG PB_VERSION=$VERSION$" "$f" || { echo "❌ $f PB_VERSION not at $VERSION"; exit 1; }
          done
          echo "✅ Version surfaces consistent: changelog, pyproject, pb_version, Dockerfiles"

      - name: Assert no competing tag
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if git ls-remote --tags origin "$VERSION" | grep -q "$VERSION"; then
            echo "❌ Tag $VERSION already exists on origin. Refusing to release a version that is already published."
            exit 1
          fi
          echo "✅ No competing tag $VERSION"

  # ---------------------------------------------------------------------------
  # Phase 1: Build candidates under immutable tags. NEVER push version/latest
  # here - promotion happens only after the runtime gate passes.
  # ---------------------------------------------------------------------------
  build-candidates:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event.inputs.skip_docker != 'true'
    strategy:
      matrix:
        include:
          - image: admin-ui
            context: ./admin-ui
            dockerfile: ./admin-ui/Dockerfile
          - image: recursor
            context: ./recursor
            dockerfile: ./recursor/Dockerfile
          - image: dnstap-processor
            context: ./dnstap-processor
            dockerfile: ./dnstap-processor/Dockerfile
          - image: sync-agent
            context: ./sync-agent
            dockerfile: ./sync-agent/Dockerfile
          - image: recursor-reloader
            context: ./recursor-reloader
            dockerfile: ./recursor-reloader/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push candidate image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image }}:${{ env.CANDIDATE_TAG }}
          build-args: |
            PB_VERSION=${{ needs.validate.outputs.version }}

      - name: Record candidate reference
        run: |
          echo "Candidate: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image }}:${{ env.CANDIDATE_TAG }}"
          echo "candidate_tag=${{ env.CANDIDATE_TAG }}" >> "$GITHUB_ENV"

  # ---------------------------------------------------------------------------
  # Phase 2: Runtime gate against the CANDIDATES (not already-published tags).
  # ---------------------------------------------------------------------------
  runtime-gate:
    runs-on: ubuntu-latest
    needs: [validate, build-candidates]
    if: github.event.inputs.skip_docker != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Pull candidate images
        run: |
          for img in admin-ui recursor dnstap-processor sync-agent recursor-reloader; do
            docker pull ghcr.io/zerostate-io/powerblockade-$img:${{ env.CANDIDATE_TAG }}
          done

      - name: Prepare runtime gate environment
        run: |
          TEST_ADMIN_USERNAME="runtime-gate-admin"
          TEST_ADMIN_PASSWORD="runtime-gate-password-${GITHUB_RUN_ID}"

          ./scripts/init-env.sh --non-interactive \
            --node-name "runtime-gate" \
            --admin-username "$TEST_ADMIN_USERNAME" \
            --admin-password "$TEST_ADMIN_PASSWORD" \
            --dns-bind-address "0.0.0.0"

          {
            echo "TEST_ADMIN_USERNAME=$TEST_ADMIN_USERNAME"
            echo "TEST_ADMIN_PASSWORD=$TEST_ADMIN_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Create compose override for CI runtime gate
        run: |
          # NOTE: use 'ports: !override' — a plain ports list is *appended* by
          # compose merge, so the base '0.0.0.0:53' mapping would stay bound and
          # fail on runners where port 53 is taken (observed 2026-08-18).
          cat > "$RUNNER_TEMP/runtime-gate.override.yml" <<'EOF'
          services:
            dnsdist:
              ports: !override
                - "127.0.0.1:1053:53/udp"
                - "127.0.0.1:1053:53/tcp"
            admin-ui:
              ports: !override
                - "18080:8080"
          EOF

      - name: Start runtime gate stack (candidate images)
        run: |
          export POWERBLOCKADE_VERSION="${{ env.CANDIDATE_TAG }}"
          # Point the compose image tags at the candidates via a sed-free
          # override: the ghcr compose uses ${POWERBLOCKADE_VERSION:-latest}.
          docker compose \
            -f docker-compose.ghcr.yml \
            -f "$RUNNER_TEMP/runtime-gate.override.yml" \
            up -d

      - name: Wait for core services
        run: |
          waited=0
          healthy=false
          while [[ $waited -lt 180 ]]; do
            containers_status=$(docker compose \
              -f docker-compose.ghcr.yml \
              -f "$RUNNER_TEMP/runtime-gate.override.yml" \
              ps --format "{{.Names}}:{{.Status}}" 2>/dev/null || echo "")
            required=("powerblockade-dnsdist" "powerblockade-recursor" "powerblockade-postgres" "powerblockade-admin-ui")
            healthy_count=0
            for container in "${required[@]}"; do
              if echo "$containers_status" | grep -qE "${container}.*(healthy|running|Up)"; then
                healthy_count=$((healthy_count + 1))
              fi
            done
            if [[ $healthy_count -eq ${#required[@]} ]]; then
              healthy=true
              break
            fi
            sleep 2
            waited=$((waited + 2))
          done
          if [[ "$healthy" != "true" ]]; then
            docker compose \
              -f docker-compose.ghcr.yml \
              -f "$RUNNER_TEMP/runtime-gate.override.yml" \
              ps
            exit 1
          fi

      - name: Verify admin runtime health
        run: |
          # admin-ui runs 'alembic upgrade head' before uvicorn listens; on a
          # fresh DB the full migration batch takes 1-2 minutes. Poll /health
          # for up to 240s before the one-shot page checks.
          for i in $(seq 1 120); do
            health_code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:18080/health" 2>/dev/null || echo "000")
            if [[ "$health_code" == "200" ]]; then
              echo "admin-ui /health OK after $((i * 2))s"
              break
            fi
            sleep 2
          done

          ROOT_RESPONSE=$(curl -s -i "http://localhost:18080/" 2>/dev/null || true)
          ROOT_CODE=$(printf "%s" "$ROOT_RESPONSE" | awk 'NR==1 {print $2}')
          if [[ "$ROOT_CODE" != "200" ]]; then
            printf "%s\n" "$ROOT_RESPONSE" | sed -n '1,20p'
            exit 1
          fi

          # The app uses Double-Submit CSRF (csrf_token cookie + form field).
          # Obtain the cookie from the login page, then echo it back on POST.
          COOKIE_JAR="$RUNNER_TEMP/gate-cookies.txt"
          rm -f "$COOKIE_JAR"
          curl -s -c "$COOKIE_JAR" "http://localhost:18080/login" >/dev/null 2>&1 || true
          CSRF_TOKEN=$(awk '$6 == "csrf_token" {print $7}' "$COOKIE_JAR" 2>/dev/null | tail -1)
          if [[ -z "$CSRF_TOKEN" ]]; then
            echo "WARNING: no csrf_token cookie obtained from GET /login"
          fi

          LOGIN_PAGE_RESPONSE=$(curl -s -i "http://localhost:18080/login" 2>/dev/null || true)
          LOGIN_PAGE_CODE=$(printf "%s" "$LOGIN_PAGE_RESPONSE" | awk 'NR==1 {print $2}')
          if [[ "$LOGIN_PAGE_CODE" != "200" ]]; then
            printf "%s\n" "$LOGIN_PAGE_RESPONSE" | sed -n '1,20p'
            exit 1
          fi

          # POST as application/x-www-form-urlencoded: curl -F sends multipart,
          # which the app's CSRF middleware does not parse (browser forms are
          # urlencoded). Send the csrf_token cookie value back as a field.
          LOGIN_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            --data-urlencode "username=$TEST_ADMIN_USERNAME" \
            --data-urlencode "password=$TEST_ADMIN_PASSWORD" \
            --data-urlencode "csrf_token=$CSRF_TOKEN" \
            -b "$COOKIE_JAR" -c "$COOKIE_JAR" \
            "http://localhost:18080/login" 2>/dev/null || echo -e "\n000")

          LOGIN_BODY=$(echo "$LOGIN_RESPONSE" | head -n -1)
          LOGIN_CODE=$(echo "$LOGIN_RESPONSE" | tail -n 1)

          if [[ "$LOGIN_CODE" != "302" && "$LOGIN_CODE" != "200" ]]; then
            echo "$LOGIN_BODY" | head -20
            exit 1
          fi

          if [[ "$LOGIN_CODE" == "200" ]] && echo "$LOGIN_BODY" | grep -qi "invalid credentials"; then
            exit 1
          fi

          HEALTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:18080/health" 2>/dev/null || echo "000")
          if [[ "$HEALTH_CODE" != "200" ]]; then
            exit 1
          fi
          echo "✅ Runtime gate passed: admin-ui reachable, login works, /health 200"

      - name: Dump runtime-gate diagnostics
        if: failure()
        run: |
          echo "=== compose ps ==="
          docker compose \
            -f docker-compose.ghcr.yml \
            -f "$RUNNER_TEMP/runtime-gate.override.yml" \
            ps -a --format "{{.Name}} | {{.Status}}" 2>&1 || true
          for c in powerblockade-admin-ui powerblockade-recursor powerblockade-dnsdist powerblockade-postgres powerblockade-init-permissions; do
            echo "=== $c logs (tail 40) ==="
            docker logs "$c" --tail 40 2>&1 || true
          done
          echo "=== /health raw ==="
          curl -s -i "http://localhost:18080/health" 2>&1 | head -20 || true

      - name: Cleanup runtime gate stack
        if: always()
        run: |
          docker compose \
            -f docker-compose.ghcr.yml \
            -f "$RUNNER_TEMP/runtime-gate.override.yml" \
            down -v --remove-orphans || true

  # ---------------------------------------------------------------------------
  # Phase 3: Fresh Install Smoke Test (advisory) against candidates.
  # ---------------------------------------------------------------------------
  smoke-test:
    runs-on: ubuntu-latest
    needs: [validate, build-candidates]
    if: github.event.inputs.skip_docker != 'true'
    outputs:
      smoke_outcome: ${{ steps.smoke_run.outcome }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Pull candidate images
        run: |
          for img in admin-ui recursor dnstap-processor sync-agent recursor-reloader; do
            docker pull ghcr.io/zerostate-io/powerblockade-$img:${{ env.CANDIDATE_TAG }}
          done

      - name: Run fresh install smoke test
        id: smoke_run
        continue-on-error: true
        run: |
          export POWERBLOCKADE_VERSION="${{ env.CANDIDATE_TAG }}"
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh

      - name: Report advisory smoke test status
        if: steps.smoke_run.outcome == 'failure'
        run: |
          echo "::warning::Fresh install smoke test failed on this runner. Release publication is gated by runtime-gate; investigate smoke-test logs for install-path issues."

  # ---------------------------------------------------------------------------
  # Phase 4: Promote (ONLY after the gate passed; never in dry-run).
  # Publishes version + latest tags BY DIGEST from the validated candidates,
  # creates the immutable git tag at the exact built commit, then the release.
  # ---------------------------------------------------------------------------
  promote:
    runs-on: ubuntu-latest
    needs: [validate, build-candidates, runtime-gate]
    if: >-
      github.event.inputs.dry_run != 'true' &&
      needs.runtime-gate.result == 'success'
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote candidate images to version + latest (by digest)
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          for img in admin-ui recursor dnstap-processor sync-agent recursor-reloader; do
            CANDIDATE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${img}:${{ env.CANDIDATE_TAG }}"
            echo "Promoting $CANDIDATE -> $VERSION + latest"
            # Re-verify the candidate exists, then tag it (multi-arch manifest)
            docker buildx imagetools inspect "$CANDIDATE" >/dev/null || { echo "❌ candidate missing: $CANDIDATE"; exit 1; }
            docker buildx imagetools create \
              --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${img}:${VERSION}" \
              --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${img}:latest" \
              "$CANDIDATE"
          done
          echo "✅ All 5 images promoted to $VERSION + latest (by digest)"

      - name: Checkout code (for tag + release notes)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create and push immutable git tag
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Tag the exact commit that was built and gated
          git tag -a "$VERSION" -m "Release $VERSION

          Automated release created after candidate build + runtime gate passed." "${{ github.sha }}"
          git push origin "$VERSION"
          echo "✅ Tag $VERSION pushed at $(git rev-parse --short "$VERSION")"

      - name: Generate changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -v "^${VERSION}$" | head -n 1 || true)
          if [[ -z "$PREVIOUS_TAG" ]]; then
            echo "### Changes" > release-notes.md
            echo "Initial release or first tagged version" >> release-notes.md
          else
            {
              echo "### Changes since $PREVIOUS_TAG"
              echo ""
              git log --pretty=format:"- %s" "${PREVIOUS_TAG}..${VERSION}"
            } > release-notes.md
          fi

      - name: Create GitHub Release
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const version = '${{ needs.validate.outputs.version }}';
            const changelog = fs.readFileSync('release-notes.md', 'utf8');
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: `Release ${version}`,
              body: changelog,
              draft: false,
              prerelease: false
            });
            console.log(`✅ GitHub Release created for ${version}`);

  # ---------------------------------------------------------------------------
  # Summary
  # ---------------------------------------------------------------------------
  summary:
    runs-on: ubuntu-latest
    if: always()
    needs: [validate, build-candidates, runtime-gate, smoke-test, promote]
    steps:
      - name: Release summary
        run: |
          echo "## Release Summary"
          echo ""
          echo "✅ Version: ${{ needs.validate.outputs.version }}"
          echo "✅ Candidate tag: ${{ env.CANDIDATE_TAG }}"
          echo "✅ Dry run: ${{ github.event.inputs.dry_run }}"
          echo "✅ Build candidates: ${{ needs.build-candidates.result }}"
          echo "✅ Runtime gate: ${{ needs.runtime-gate.result }}"
          echo "✅ Advisory install smoke: ${{ needs.smoke-test.outputs.smoke_outcome || needs.smoke-test.result || 'skipped' }}"
          echo "✅ Promote (version+latest tags, git tag, release): ${{ needs.promote.result || 'skipped (dry_run or gate not passed)' }}"
