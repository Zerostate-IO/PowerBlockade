name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.9.0). The version bump commit + CHANGELOG entry must already be on main.'
        required: true
        type: string
      dry_run:
        description: 'Build + gate candidate images only; no promotion, no git tag, no GitHub release.'
        required: false
        type: boolean
        default: true
      skip_docker:
        description: 'DEPRECATED. If true, nothing is built and no release can be created.'
        required: false
        type: boolean
        default: false

# Serialize ALL releases of this release unit: every run writes the same
# version + latest tags, so only one may be in flight at a time.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zerostate-io/powerblockade
  # Immutable candidate tag: unique per run AND rerun attempt so a rerun can
  # never replace a candidate that a previous attempt gated.
  CANDIDATE_TAG: candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # ---------------------------------------------------------------------------
  # Phase 0: Validate. The version bump + CHANGELOG entry are done on main
  # BEFORE dispatch. Asserts version-surface consistency, main-branch origin,
  # forward progression, no competing git tag, and no existing GHCR version
  # tags. No repo mutation.
  # ---------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      version_plain: ${{ steps.validate.outputs.version_plain }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Pass the raw dispatch input through env (string context, no shell
      # evaluation) - never interpolate it into generated shell source.
      - name: Validate version format
        id: validate
        env:
          RAW_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="$RAW_VERSION"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $VERSION (expected vX.Y.Z)"
            exit 1
          fi
          VERSION_PLAIN="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_plain=$VERSION_PLAIN" >> "$GITHUB_OUTPUT"
          echo "✅ Version format valid: $VERSION"

      - name: Assert dispatch is from main
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "❌ Releases must be dispatched from refs/heads/main (got ${{ github.ref }})"
            exit 1
          fi
          echo "✅ Dispatch from main"

      - name: Assert version surfaces are consistent
        env:
          VERSION: ${{ steps.validate.outputs.version }}
          VERSION_PLAIN: ${{ steps.validate.outputs.version_plain }}
        run: |
          set -e
          grep -q "^## \[$VERSION_PLAIN\]" CHANGELOG.md || { echo "❌ CHANGELOG.md missing '## [$VERSION_PLAIN]'"; exit 1; }
          grep -q "^version = \"$VERSION_PLAIN\"$" admin-ui/pyproject.toml || { echo "❌ admin-ui/pyproject.toml not at $VERSION_PLAIN"; exit 1; }
          grep -q "^    pb_version: str = \"$VERSION\"$" admin-ui/app/settings.py || { echo "❌ settings.py pb_version not at $VERSION"; exit 1; }
          # Multi-stage Dockerfiles (dnstap-processor, prober) declare
          # ARG PB_VERSION once per stage: EVERY occurrence must be at $VERSION.
          for f in admin-ui/Dockerfile dnstap-processor/Dockerfile sync-agent/Dockerfile prober/Dockerfile; do
            total=$(grep -c "^ARG PB_VERSION=" "$f" || true)
            matched=$(grep -c "^ARG PB_VERSION=$VERSION$" "$f" || true)
            if [[ "$total" -eq 0 || "$matched" -ne "$total" ]]; then
              echo "❌ $f PB_VERSION not at $VERSION on all $total ARG line(s) (only $matched match)"
              exit 1
            fi
          done
          echo "✅ Version surfaces consistent: changelog, pyproject, pb_version, Dockerfiles"

      - name: Assert forward version progression
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          HIGHEST=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [[ -n "$HIGHEST" && "$HIGHEST" != "$VERSION" ]]; then
            IFS='.' read -ra a <<< "${VERSION#v}"
            IFS='.' read -ra b <<< "${HIGHEST#v}"
            if (( ${a[0]} < ${b[0]} \
                  || (${a[0]} == ${b[0]} && ${a[1]} < ${b[1]}) \
                  || (${a[0]} == ${b[0]} && ${a[1]} == ${b[1]} && ${a[2]} < ${b[2]}) )); then
              echo "❌ $VERSION is older than the latest release tag $HIGHEST; refusing non-forward release"
              exit 1
            fi
          fi
          echo "✅ Version $VERSION is forward of existing tags"

      - name: Assert no competing git tag (allow exact-SHA recovery)
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          if git ls-remote --tags origin "$VERSION" | grep -q "$VERSION"; then
            # Peel annotated tags: ls-remote returns the tag object sha for
            # annotated tags; the workflow creates annotated tags.
            git fetch -q origin "refs/tags/$VERSION:refs/tags/tmp-check-$VERSION"
            TAGGED_SHA=$(git rev-list -n 1 "refs/tags/tmp-check-$VERSION")
            git tag -d "tmp-check-$VERSION" >/dev/null 2>&1 || true
            if [[ "$TAGGED_SHA" == "${{ github.sha }}" ]]; then
              echo "⚠️ Tag $VERSION exists at the exact dispatched SHA - treating as resumable release"
            else
              echo "❌ Tag $VERSION exists at commit $TAGGED_SHA (not the dispatched SHA ${{ github.sha }}). Refusing."
              exit 1
            fi
          else
            echo "✅ No competing git tag $VERSION"
          fi

      - name: Assert no existing GHCR version tags (allow if resuming an exact-SHA release)
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null 2>&1 || { echo "❌ GHCR login failed"; exit 1; }
          # Fail closed: only a definitive 'not found' counts as absent.
          EXISTING=""
          for img in admin-ui recursor dnstap-processor sync-agent recursor-reloader prober; do
            ref="ghcr.io/zerostate-io/powerblockade-${img}:${VERSION}"
            out=$(docker buildx imagetools inspect "$ref" 2>&1) && exists=1 || {
              if echo "$out" | grep -qiE "not found|manifest unknown|404|no such manifest"; then exists=0; else
                echo "❌ Registry check failed for $ref (cannot determine absence):"
                echo "$out" | head -5
                exit 1
              fi
            }
            if [[ "$exists" == "1" ]]; then EXISTING="$EXISTING $img"; fi
          done
          if [[ -n "$EXISTING" ]]; then
            # A rerun of a partially completed release is only allowed when the
            # git tag already exists at the exact dispatched SHA.
            if git ls-remote --tags origin "$VERSION" | grep -q "$VERSION"; then
              git fetch -q origin "refs/tags/$VERSION:refs/tags/tmp-resume-$VERSION"
              RESUMING_SHA=$(git rev-list -n 1 "refs/tags/tmp-resume-$VERSION")
              git tag -d "tmp-resume-$VERSION" >/dev/null 2>&1 || true
              if [[ "$RESUMING_SHA" == "${{ github.sha }}" ]]; then
                echo "⚠️ GHCR $VERSION tags exist AND git tag $VERSION == dispatched SHA - resuming a partial release"
                exit 0
              fi
            fi
            echo "❌ GHCR version tags already exist for:${EXISTING}"
            echo "   An existing release version cannot be overwritten. If a previous promotion"
            echo "   partially completed, delete the GHCR tags via the package UI, or release a new version."
            exit 1
          fi
          echo "✅ No existing GHCR $VERSION tags"

  # ---------------------------------------------------------------------------
  # Phase 1: Build candidates under immutable tags. NEVER push version/latest
  # here. Records each image's digest for gate + promotion.
  # ---------------------------------------------------------------------------
  build-candidates:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event.inputs.skip_docker != 'true'
    strategy:
      matrix:
        include:
          - image: admin-ui
            context: ./admin-ui
            dockerfile: ./admin-ui/Dockerfile
          - image: recursor
            context: ./recursor
            dockerfile: ./recursor/Dockerfile
          - image: dnstap-processor
            context: ./dnstap-processor
            dockerfile: ./dnstap-processor/Dockerfile
          - image: sync-agent
            context: ./sync-agent
            dockerfile: ./sync-agent/Dockerfile
          - image: recursor-reloader
            context: ./recursor-reloader
            dockerfile: ./recursor-reloader/Dockerfile
          - image: prober
            context: ./prober
            dockerfile: ./prober/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push candidate image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image }}:${{ env.CANDIDATE_TAG }}
          build-args: |
            PB_VERSION=${{ needs.validate.outputs.version }}

      - name: Record candidate tag
        run: |
          echo "candidate_tag=${{ env.CANDIDATE_TAG }}" >> "$GITHUB_ENV"
          echo "✅ ${{ matrix.image }} built: ${{ steps.build.outputs.digest }}"

  # ---------------------------------------------------------------------------
  # Phase 2: Runtime gate against the CANDIDATES. Covers all six images:
  # the primary stack (incl. dnstap-processor + recursor-reloader + prober)
  # and the secondary profile (sync-agent). Records the gated digests for
  # promotion.
  # ---------------------------------------------------------------------------
  runtime-gate:
    runs-on: ubuntu-latest
    needs: [validate, build-candidates]
    if: github.event.inputs.skip_docker != 'true'
    outputs:
      digest_admin_ui: ${{ steps.record_digests.outputs.digest_admin_ui }}
      digest_recursor: ${{ steps.record_digests.outputs.digest_recursor }}
      digest_dnstap_processor: ${{ steps.record_digests.outputs.digest_dnstap_processor }}
      digest_sync_agent: ${{ steps.record_digests.outputs.digest_sync_agent }}
      digest_recursor_reloader: ${{ steps.record_digests.outputs.digest_recursor_reloader }}
      digest_prober: ${{ steps.record_digests.outputs.digest_prober }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull candidate images
        run: |
          for img in admin-ui recursor dnstap-processor sync-agent recursor-reloader prober; do
            docker pull ghcr.io/zerostate-io/powerblockade-$img:${{ env.CANDIDATE_TAG }}
          done

      - name: Record gated digests
        id: record_digests
        run: |
          for img in admin-ui recursor dnstap-processor sync-agent recursor-reloader prober; do
            key="digest_${img//-/_}"
            d=$(docker image inspect --format '{{index .RepoDigests 0}}' "ghcr.io/zerostate-io/powerblockade-${img}:${{ env.CANDIDATE_TAG }}" 2>/dev/null | cut -d'@' -f2)
            echo "${key}=$d" >> "$GITHUB_OUTPUT"
            echo "gated ${img} digest: $d"
          done

      - name: Prepare runtime gate environment
        run: |
          TEST_ADMIN_USERNAME="runtime-gate-admin"
          TEST_ADMIN_PASSWORD="runtime-gate-password-${GITHUB_RUN_ID}"

          ./scripts/init-env.sh --non-interactive \
            --node-name "runtime-gate" \
            --admin-username "$TEST_ADMIN_USERNAME" \
            --admin-password "$TEST_ADMIN_PASSWORD" \
            --dns-bind-address "0.0.0.0"

          {
            echo "TEST_ADMIN_USERNAME=$TEST_ADMIN_USERNAME"
            echo "TEST_ADMIN_PASSWORD=$TEST_ADMIN_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Create compose override for CI runtime gate
        run: |
          # NOTE: use 'ports: !override' — a plain ports list is *appended* by
          # compose merge, so the base '0.0.0.0:53' mapping would stay bound and
          # fail on runners where port 53 is taken (observed 2026-08-18).
          cat > "$RUNNER_TEMP/runtime-gate.override.yml" <<'EOF'
          services:
            dnsdist:
              ports: !override
                - "127.0.0.1:1053:53/udp"
                - "127.0.0.1:1053:53/tcp"
            admin-ui:
              ports: !override
                - "18080:8080"
          EOF

      - name: Start runtime gate stack (candidate images)
        run: |
          export POWERBLOCKADE_VERSION="${{ env.CANDIDATE_TAG }}"
          docker compose \
            -f docker-compose.ghcr.yml \
            -f "$RUNNER_TEMP/runtime-gate.override.yml" \
            up -d

      - name: Wait for core services (all six images)
        run: |
          waited=0
          while [[ $waited -lt 180 ]]; do
            containers_status=$(docker compose \
              -f docker-compose.ghcr.yml \
              -f "$RUNNER_TEMP/runtime-gate.override.yml" \
              ps --format "{{.Names}}:{{.Status}}" 2>/dev/null || echo "")
            required=(
              "powerblockade-dnsdist" "powerblockade-recursor" "powerblockade-postgres"
              "powerblockade-admin-ui" "powerblockade-dnstap-processor" "powerblockade-recursor-reloader"
              "powerblockade-prober"
            )
            healthy_count=0
            for container in "${required[@]}"; do
              if echo "$containers_status" | grep -qE "${container}.*(healthy|running|Up)"; then
                healthy_count=$((healthy_count + 1))
              fi
            done
            if [[ $healthy_count -eq ${#required[@]} ]]; then
              echo "✅ All core containers up after $((waited * 2))s"
              break
            fi
            sleep 2
            waited=$((waited + 2))
          done
          if [[ $healthy_count -ne ${#required[@]} ]]; then
            docker compose \
              -f docker-compose.ghcr.yml \
              -f "$RUNNER_TEMP/runtime-gate.override.yml" \
              ps
            exit 1
          fi

      - name: Verify admin runtime health
        run: |
          # admin-ui runs 'alembic upgrade head' before uvicorn listens; on a
          # fresh DB the full migration batch takes 1-2 minutes. Poll /health
          # for up to 240s before the one-shot page checks.
          for i in $(seq 1 120); do
            health_code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:18080/health" 2>/dev/null || echo "000")
            if [[ "$health_code" == "200" ]]; then
              echo "admin-ui /health OK after $((i * 2))s"
              break
            fi
            sleep 2
          done

          ROOT_RESPONSE=$(curl -s -i "http://localhost:18080/" 2>/dev/null || true)
          ROOT_CODE=$(printf "%s" "$ROOT_RESPONSE" | awk 'NR==1 {print $2}')
          if [[ "$ROOT_CODE" != "200" ]]; then
            printf "%s\n" "$ROOT_RESPONSE" | sed -n '1,20p'
            exit 1
          fi

          # The app uses Double-Submit CSRF (csrf_token cookie + form field).
          # Obtain the cookie from the login page, then echo it back on POST.
          COOKIE_JAR="$RUNNER_TEMP/gate-cookies.txt"
          rm -f "$COOKIE_JAR"
          curl -s -c "$COOKIE_JAR" "http://localhost:18080/login" >/dev/null 2>&1 || true
          CSRF_TOKEN=$(awk '$6 == "csrf_token" {print $7}' "$COOKIE_JAR" 2>/dev/null | tail -1)
          if [[ -z "$CSRF_TOKEN" ]]; then
            echo "WARNING: no csrf_token cookie obtained from GET /login"
          fi

          LOGIN_PAGE_RESPONSE=$(curl -s -i "http://localhost:18080/login" 2>/dev/null || true)
          LOGIN_PAGE_CODE=$(printf "%s" "$LOGIN_PAGE_RESPONSE" | awk 'NR==1 {print $2}')
          if [[ "$LOGIN_PAGE_CODE" != "200" ]]; then
            printf "%s\n" "$LOGIN_PAGE_RESPONSE" | sed -n '1,20p'
            exit 1
          fi

          # POST as application/x-www-form-urlencoded: curl -F sends multipart,
          # which the app's CSRF middleware does not parse (browser forms are
          # urlencoded). Send the csrf_token cookie value back as a field.
          LOGIN_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            --data-urlencode "username=$TEST_ADMIN_USERNAME" \
            --data-urlencode "password=$TEST_ADMIN_PASSWORD" \
            --data-urlencode "csrf_token=$CSRF_TOKEN" \
            -b "$COOKIE_JAR" -c "$COOKIE_JAR" \
            "http://localhost:18080/login" 2>/dev/null || echo -e "\n000")

          LOGIN_BODY=$(echo "$LOGIN_RESPONSE" | head -n -1)
          LOGIN_CODE=$(echo "$LOGIN_RESPONSE" | tail -n 1)

          if [[ "$LOGIN_CODE" != "302" && "$LOGIN_CODE" != "200" ]]; then
            echo "$LOGIN_BODY" | head -20
            exit 1
          fi

          if [[ "$LOGIN_CODE" == "200" ]] && echo "$LOGIN_BODY" | grep -qi "invalid credentials"; then
            exit 1
          fi

          HEALTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:18080/health" 2>/dev/null || echo "000")
          if [[ "$HEALTH_CODE" != "200" ]]; then
            exit 1
          fi
          echo "✅ Runtime gate passed: admin-ui reachable, login works, /health 200"

      - name: Gate the secondary profile (sync-agent)
        run: |
          export POWERBLOCKADE_VERSION="${{ env.CANDIDATE_TAG }}"
          docker compose \
            -f docker-compose.ghcr.yml \
            -f "$RUNNER_TEMP/runtime-gate.override.yml" \
            --profile secondary \
            up -d sync-agent 2>&1 | tail -3
          waited=0
          while [[ $waited -lt 60 ]]; do
            status=$(docker inspect -f '{{.State.Status}} {{.State.Running}}' powerblockade-sync-agent 2>/dev/null || echo "missing")
            if echo "$status" | grep -qE "^running true"; then
              echo "✅ sync-agent (secondary profile) running: $status"
              break
            fi
            sleep 2
            waited=$((waited + 2))
          done
          if ! echo "$status" | grep -qE "^running true"; then
            docker logs powerblockade-sync-agent --tail 20 2>&1 || true
            exit 1
          fi
          # Give it a heartbeat cycle, then require a genuinely running,
          # non-restarting container (missing/exited/dead/restarting must fail).
          sleep 15
          state=$(docker inspect -f '{{.State.Status}}|{{.State.Restarting}}' powerblockade-sync-agent 2>/dev/null || echo "missing|1")
          if [[ "$state" != "running|0" ]]; then
            echo "❌ sync-agent not stable after heartbeat window: $state"
            docker logs powerblockade-sync-agent --tail 20 2>&1 || true
            exit 1
          fi
          echo "✅ sync-agent stable after heartbeat window (running, no restarts)"

      - name: Dump runtime-gate diagnostics
        if: failure()
        run: |
          echo "=== compose ps ==="
          docker compose \
            -f docker-compose.ghcr.yml \
            -f "$RUNNER_TEMP/runtime-gate.override.yml" \
            ps -a --format "{{.Name}} | {{.Status}}" 2>&1 || true
          for c in powerblockade-admin-ui powerblockade-recursor powerblockade-dnsdist powerblockade-postgres powerblockade-dnstap-processor powerblockade-recursor-reloader powerblockade-prober powerblockade-sync-agent; do
            echo "=== $c logs (tail 40) ==="
            docker logs "$c" --tail 40 2>&1 || true
          done
          echo "=== /health raw ==="
          curl -s -i "http://localhost:18080/health" 2>&1 | head -20 || true

      - name: Cleanup runtime gate stack
        if: always()
        run: |
          docker compose \
            -f docker-compose.ghcr.yml \
            -f "$RUNNER_TEMP/runtime-gate.override.yml" \
            --profile secondary \
            down -v --remove-orphans || true

  # ---------------------------------------------------------------------------
  # Phase 3: Fresh Install Smoke Test (advisory) against candidates.
  # ---------------------------------------------------------------------------
  smoke-test:
    runs-on: ubuntu-latest
    needs: [validate, build-candidates]
    if: github.event.inputs.skip_docker != 'true'
    outputs:
      smoke_outcome: ${{ steps.smoke_run.outcome }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull candidate images
        run: |
          for img in admin-ui recursor dnstap-processor sync-agent recursor-reloader prober; do
            docker pull ghcr.io/zerostate-io/powerblockade-$img:${{ env.CANDIDATE_TAG }}
          done

      - name: Run fresh install smoke test
        id: smoke_run
        continue-on-error: true
        run: |
          export POWERBLOCKADE_VERSION="${{ env.CANDIDATE_TAG }}"
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh

      - name: Report advisory smoke test status
        if: steps.smoke_run.outcome == 'failure'
        run: |
          echo "::warning::Fresh install smoke test failed on this runner. Release publication is gated by runtime-gate; investigate smoke-test logs for install-path issues."

  # ---------------------------------------------------------------------------
  # Phase 4: Promote (ONLY after the gate passed; never in dry-run).
  # Publishes version + latest tags BY the gated DIGEST, creates the immutable
  # git tag at the exact built commit, then the release. Resumable: a rerun
  # with the same SHA skips steps that already completed.
  # ---------------------------------------------------------------------------
  promote:
    runs-on: ubuntu-latest
    needs: [validate, build-candidates, runtime-gate]
    if: >-
      github.event.inputs.dry_run != 'true' &&
      needs.runtime-gate.result == 'success'
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all gated digests before promoting anything
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          declare -A DIGESTS=(
            [admin-ui]="${{ needs.runtime-gate.outputs.digest_admin_ui }}"
            [recursor]="${{ needs.runtime-gate.outputs.digest_recursor }}"
            [dnstap-processor]="${{ needs.runtime-gate.outputs.digest_dnstap_processor }}"
            [sync-agent]="${{ needs.runtime-gate.outputs.digest_sync_agent }}"
            [recursor-reloader]="${{ needs.runtime-gate.outputs.digest_recursor_reloader }}"
            [prober]="${{ needs.runtime-gate.outputs.digest_prober }}"
          )
          for img in "${!DIGESTS[@]}"; do
            d="${DIGESTS[$img]}"
            if [[ -z "$d" ]]; then echo "❌ no gated digest for $img"; exit 1; fi
            # The gated digest must still resolve from the candidate tag
            resolved=$(docker buildx imagetools inspect "ghcr.io/zerostate-io/powerblockade-${img}:${{ env.CANDIDATE_TAG }}" 2>/dev/null | grep -oE 'sha256:[a-f0-9]{64}' | head -1)
            if [[ "$resolved" != "$d" ]]; then
              echo "❌ $img candidate digest changed (expected $d, got $resolved)"
              exit 1
            fi
            echo "✅ $img candidate verified: $d"
          done

      - name: Promote all images to version + latest (by gated digest)
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          declare -A DIGESTS=(
            [admin-ui]="${{ needs.runtime-gate.outputs.digest_admin_ui }}"
            [recursor]="${{ needs.runtime-gate.outputs.digest_recursor }}"
            [dnstap-processor]="${{ needs.runtime-gate.outputs.digest_dnstap_processor }}"
            [sync-agent]="${{ needs.runtime-gate.outputs.digest_sync_agent }}"
            [recursor-reloader]="${{ needs.runtime-gate.outputs.digest_recursor_reloader }}"
            [prober]="${{ needs.runtime-gate.outputs.digest_prober }}"
          )
          for img in admin-ui recursor dnstap-processor sync-agent recursor-reloader prober; do
            d="${DIGESTS[$img]}"
            echo "Promoting $img -> $VERSION + latest (digest $d)"
            docker buildx imagetools create \
              --tag "ghcr.io/zerostate-io/powerblockade-${img}:${VERSION}" \
              --tag "ghcr.io/zerostate-io/powerblockade-${img}:latest" \
              "ghcr.io/zerostate-io/powerblockade-${img}@${d}"
          done

      - name: Verify promoted tags match the gated digests
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          declare -A DIGESTS=(
            [admin-ui]="${{ needs.runtime-gate.outputs.digest_admin_ui }}"
            [recursor]="${{ needs.runtime-gate.outputs.digest_recursor }}"
            [dnstap-processor]="${{ needs.runtime-gate.outputs.digest_dnstap_processor }}"
            [sync-agent]="${{ needs.runtime-gate.outputs.digest_sync_agent }}"
            [recursor-reloader]="${{ needs.runtime-gate.outputs.digest_recursor_reloader }}"
            [prober]="${{ needs.runtime-gate.outputs.digest_prober }}"
          )
          for img in admin-ui recursor dnstap-processor sync-agent recursor-reloader prober; do
            d="${DIGESTS[$img]}"
            for tag in "${VERSION}" latest; do
              got=$(docker buildx imagetools inspect "ghcr.io/zerostate-io/powerblockade-${img}:${tag}" 2>/dev/null | grep -oE 'sha256:[a-f0-9]{64}' | head -1)
              if [[ "$got" != "$d" ]]; then
                echo "❌ $img:${tag} digest mismatch (expected $d, got $got)"
                exit 1
              fi
            done
            echo "✅ $img version+latest == gated digest $d"
          done

      - name: Checkout code (for tag + release notes)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create and push immutable git tag (idempotent)
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            TAGGED_SHA=$(git rev-list -n 1 "$VERSION")
            if [[ "$TAGGED_SHA" != "${{ github.sha }}" ]]; then
              echo "❌ Existing tag $VERSION points at $TAGGED_SHA, not ${{ github.sha }}"
              exit 1
            fi
            echo "⚠️ Tag $VERSION already exists at the gated SHA - skipping creation (resume)"
          else
            git tag -a "$VERSION" -m "Release $VERSION (automated, gate-passed)" "${{ github.sha }}"
            git push origin "$VERSION"
            echo "✅ Tag $VERSION pushed at $(git rev-parse --short "$VERSION")"
          fi

      - name: Generate changelog
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -v "^${VERSION}$" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [[ -z "$PREVIOUS_TAG" ]]; then
            echo "### Changes" > release-notes.md
            echo "Initial release or first tagged version" >> release-notes.md
          else
            {
              echo "### Changes since $PREVIOUS_TAG"
              echo ""
              git log --pretty=format:"- %s" "${PREVIOUS_TAG}..${VERSION}"
            } > release-notes.md
          fi

      - name: Create GitHub Release (idempotent)
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const version = process.env.VERSION;
            const changelog = fs.readFileSync('release-notes.md', 'utf8');
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: version,
              });
              console.log(`⚠️ Release ${version} already exists - updating body (resume)`);
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existing.data.id,
                body: changelog,
              });
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: version,
                name: `Release ${version}`,
                body: changelog,
                draft: false,
                prerelease: false,
              });
              console.log(`✅ GitHub Release created for ${version}`);
            }

  # ---------------------------------------------------------------------------
  # Summary
  # ---------------------------------------------------------------------------
  summary:
    runs-on: ubuntu-latest
    if: always()
    needs: [validate, build-candidates, runtime-gate, smoke-test, promote]
    steps:
      - name: Release summary
        run: |
          echo "## Release Summary"
          echo ""
          echo "✅ Version: ${{ needs.validate.outputs.version }}"
          echo "✅ Candidate tag: ${{ env.CANDIDATE_TAG }}"
          echo "✅ Dry run: ${{ github.event.inputs.dry_run }}"
          echo "✅ Build candidates: ${{ needs.build-candidates.result }}"
          echo "✅ Runtime gate (all 6 images + secondary profile): ${{ needs.runtime-gate.result }}"
          echo "✅ Advisory install smoke: ${{ needs.smoke-test.outputs.smoke_outcome || needs.smoke-test.result || 'skipped' }}"
          echo "✅ Promote (version+latest by digest, git tag, release): ${{ needs.promote.result || 'skipped (dry_run or gate not passed)' }}"
          echo ""
          echo "Note: candidate tags (candidate-<sha>-<run_id>-<run_attempt>) are immutable and left in"
          echo "GHCR for audit; prune them via the package UI when they accumulate."
